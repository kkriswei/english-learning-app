<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英语学习 · 正在更新</title>
<style>
  :root{ --bg:#f6f4ef; --ink:#17140e; --gold:#c2a14d; --faint:#8a8172; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ max-width:420px; width:100%; text-align:center; padding:48px 32px; background:#fffdf8;
         border:1px solid rgba(194,161,77,.45); border-radius:18px; box-shadow:0 12px 40px rgba(23,20,14,.08); }
  .rule{ width:56px; height:3px; background:var(--gold); border-radius:2px; margin:0 auto 26px; }
  h1{ font-family:Georgia,"Times New Roman",serif; font-size:30px; letter-spacing:.06em; margin-bottom:16px; }
  p{ font-size:16px; line-height:1.75; color:#3d382c; }
  .sub{ margin-top:14px; font-size:13.5px; color:var(--faint); line-height:1.7; }
  .spin{ width:54px; height:54px; margin:0 auto 22px; border-radius:50%;
         border:4px solid rgba(194,161,77,.25); border-top-color:var(--gold);
         animation:sp 1s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .bar{ height:10px; border-radius:99px; background:rgba(194,161,77,.18); overflow:hidden; margin:26px auto 8px; max-width:300px; }
  .bar i{ display:block; height:100%; width:0%; border-radius:99px; background:var(--gold);
          transition:width .8s ease; }
  .pct{ font-size:15px; color:#3d382c; letter-spacing:.06em; }
  .pct b{ font-size:19px; color:var(--ink); }
  .seal{ font-size:46px; line-height:1; margin-top:20px; animation:swim 3.4s ease-in-out infinite alternate; }
  @keyframes swim{
    0%{ transform:translateX(-72px) translateY(0) rotate(-5deg); }
    50%{ transform:translateX(0) translateY(-7px) rotate(4deg); }
    100%{ transform:translateX(72px) translateY(0) rotate(-5deg); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>
    <div class="spin"></div>
    <h1>正在更新</h1>
    <p>App 正在更新中，暂时不能学习，请稍后再来。</p>
    <div class="seal">🦭</div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="pct"><b id="pctNum">0%</b></div>
    <div class="sub" id="cntLine" style="margin-top:6px;">已更新 0 / 17,912 个音频</div>
    <div class="sub" id="phaseLine" style="margin-top:2px;">正在准备录音</div>
    <p class="sub">你的学习进度已经保存在云端，不会丢失。<br>更新完成后，这个页面会自动打开新版本，你什么都不用做。</p>
  </div>
<script>
  var MY_STAMP = "v202610240815";
  function check(){
    fetch("version.json?ts=" + Date.now(), { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.v && j.v !== MY_STAMP){ location.replace("./"); }
      })
      .catch(function(){});
  }
  function prog(){
    fetch("progress.json?ts=" + Date.now(), { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j || typeof j.done !== "number" || !j.total) return;
        var pct = Math.floor(j.done * 100 / j.total);
        document.getElementById("barFill").style.width = pct + "%";
        document.getElementById("pctNum").textContent = pct + "%";
        document.getElementById("cntLine").textContent = "已更新 " + j.done.toLocaleString() + " / " + j.total.toLocaleString() + " 个音频";
        if(j.phase) document.getElementById("phaseLine").textContent = j.phase;
      })
      .catch(function(){});
  }
  setInterval(check, 45000);
  setInterval(prog, 30000);
  prog();
  document.addEventListener("visibilitychange", function(){ if(!document.hidden){ check(); prog(); } });
</script>
</body>
</html>
