<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第 3 课 · 我的家人 — 动漫版样板</title>
<style>
  :root{
    --ink:#17140e; --gold:#c2a14d; --gold-soft:#e7cf8f; --paper:#f6f4ef;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#0d0b08}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    color:var(--paper); min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;min-height:100vh;background:#14110c}

  /* 顶部黑金标题条 */
  header{
    background:linear-gradient(180deg,#221d13,#17140e);
    border-bottom:2px solid var(--gold);
    padding:12px 16px calc(10px + env(safe-area-inset-top)*0) 16px;
    padding-top:calc(12px + env(safe-area-inset-top));
    display:flex;align-items:baseline;gap:10px;
  }
  header .no{
    font-family:Georgia,"Times New Roman",serif;letter-spacing:.22em;font-size:10px;color:var(--gold);
    text-transform:uppercase;white-space:nowrap;
  }
  header h1{font-size:17px;font-weight:700;letter-spacing:.06em;color:#fdfaf2}
  header h1 b{color:var(--gold-soft);font-weight:700}

  /* 舞台 */
  .stage{
    position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#20261c;
    user-select:none;touch-action:manipulation;flex:none;
  }
  .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0}
  .endimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1}
  .stage.ended .endimg{display:block}
  .stage.ended .char{display:none}

  /* 角色层：两帧叠放（neutral 底层 + talk 顶层 opacity 切换），羽化遮罩融入背景 */
  .char{
    position:absolute;bottom:0;z-index:2;pointer-events:none;
    transform-origin:50% 100%;
    transition:filter 350ms ease, transform 350ms ease;
    -webkit-mask-image:radial-gradient(ellipse 72% 68% at 50% 46%, #000 55%, transparent 98%);
            mask-image:radial-gradient(ellipse 72% 68% at 50% 46%, #000 55%, transparent 98%);
  }
  .char.rabbit{left:1%;width:41%;aspect-ratio:3/4}
  .char.tiger{right:0;width:48%;aspect-ratio:1/1}
  .char.is-speaking{filter:brightness(1.05);transform:scale(1.03)}
  .char.is-listening{filter:brightness(.92)}
  .char-inner{position:absolute;inset:0;will-change:transform}
  .char-inner img.fr{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  }
  /* 说话律动：170ms 交替 = 340ms 一周期，与换帧同节拍 */
  .char-inner.bounce{animation:bob 170ms ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(0) scale(1)}to{transform:translateY(-6px) scale(1.02)}}
  /* 听者/待机呼吸：4s 周期极慢微动 */
  .char-inner.breathe{animation:breath 4s ease-in-out infinite alternate}
  @keyframes breath{from{transform:scale(1)}to{transform:scale(1.008)}}

  /* 环境落叶/花瓣：纯 CSS 椭圆片，缓慢飘落旋转，低透明度 */
  .petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
  .petal{
    position:absolute;top:-6%;border-radius:62% 6px 62% 6px;opacity:0;
    animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite;
  }
  @keyframes fall{
    0%{top:-6%;transform:translateX(0) rotate(0deg);opacity:0}
    8%{opacity:.5}
    50%{transform:translateX(20px) rotate(190deg)}
    92%{opacity:.42}
    100%{top:103%;transform:translateX(-14px) rotate(385deg);opacity:0}
  }

  .shade{
    position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;z-index:4;
    background:linear-gradient(180deg,rgba(10,8,4,0) 0%,rgba(10,8,4,.55) 78%,rgba(10,8,4,.78) 100%);
  }

  /* 两侧点击区 */
  .tapzone{position:absolute;top:0;bottom:0;width:22%;z-index:5;cursor:pointer}
  .tapzone.left{left:0}.tapzone.right{right:0}
  .tapzone:active{background:rgba(255,255,255,.06)}

  /* 角标+字幕：底部堆叠容器，长句多行时角标自动上移不重叠 */
  .subwrap{
    position:absolute;left:0;right:0;bottom:18px;z-index:6;
    display:flex;flex-direction:column;align-items:center;gap:9px;padding:0 26px;
  }
  /* 说话方角标 */
  .badge{
    background:rgba(23,20,14,.82);border:1px solid rgba(194,161,77,.75);color:#fdf6dd;
    font-size:13px;font-weight:600;letter-spacing:.08em;padding:4px 14px;border-radius:999px;
    opacity:0;transition:opacity 250ms ease;pointer-events:none;white-space:nowrap;
  }
  .badge.show{opacity:1}

  /* 字幕 */
  .subs{
    text-align:center;cursor:pointer;width:100%;
  }
  .subs .en{
    font-family:Georgia,"Times New Roman",serif;font-weight:700;color:#fff;
    font-size:clamp(21px,6.2vw,30px);line-height:1.25;letter-spacing:.01em;
    text-shadow:2px 0 0 rgba(10,8,4,.9),-2px 0 0 rgba(10,8,4,.9),0 2px 0 rgba(10,8,4,.9),0 -2px 0 rgba(10,8,4,.9),2px 2px 0 rgba(10,8,4,.9),-2px -2px 0 rgba(10,8,4,.9),0 6px 18px rgba(0,0,0,.55);
  }
  .subs .cn{
    margin-top:6px;color:#ffeec2;font-weight:700;
    font-size:clamp(16px,4.8vw,21px);line-height:1.3;
    text-shadow:1.5px 0 0 rgba(10,8,4,.9),-1.5px 0 0 rgba(10,8,4,.9),0 1.5px 0 rgba(10,8,4,.9),0 -1.5px 0 rgba(10,8,4,.9),0 4px 12px rgba(0,0,0,.6);
  }
  .subs.pop .en,.subs.pop .cn{animation:rise .38s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .subs.hidden{opacity:0;pointer-events:none}
  .subs{transition:opacity 200ms ease}

  /* 封面 / 结尾 覆盖层 */
  .veil{
    position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(12,10,6,.34);text-align:center;padding:20px;
    opacity:1;transition:opacity 350ms ease;
  }
  .veil.gone{opacity:0;pointer-events:none}
  .veil .big{
    font-size:clamp(26px,8vw,38px);font-weight:800;color:#fff;letter-spacing:.05em;
    text-shadow:0 3px 0 rgba(10,8,4,.85),0 10px 26px rgba(0,0,0,.6);
  }
  .veil .sub{margin-top:8px;font-size:15px;color:#ffeec2;font-weight:600;text-shadow:0 2px 0 rgba(10,8,4,.85)}
  .btn{
    margin-top:22px;border:none;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.06em;
    border-radius:999px;padding:14px 34px;font-size:17px;
    background:linear-gradient(180deg,#d9ba62,#b8933d);color:#221a08;
    box-shadow:0 6px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform 120ms ease,opacity 200ms ease;
  }
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:rgba(23,20,14,.78);color:#f3e5bb;border:1px solid rgba(194,161,77,.8);box-shadow:none}
  .btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btnrow .btn{margin-top:22px;padding:12px 24px;font-size:15px;text-decoration:none;display:inline-block}

  /* 底部控制条 */
  .controls{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:20px 16px calc(18px + env(safe-area-inset-bottom));gap:18px;
    background:linear-gradient(180deg,#17140e,#100e09);
  }
  .dots{display:flex;gap:10px}
  .dot{
    width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(194,161,77,.65);
    background:transparent;cursor:pointer;padding:0;transition:background 200ms ease,transform 200ms ease;
  }
  .dot.done{background:var(--gold)}
  .dot.now{background:#fdf6dd;transform:scale(1.35);border-color:#fdf6dd}
  .cbtns{display:flex;align-items:center;gap:16px}
  .cbtn{
    width:52px;height:52px;border-radius:50%;border:1px solid rgba(194,161,77,.55);
    background:rgba(246,244,239,.06);color:#f3e5bb;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform 120ms ease,background 200ms ease;font-family:inherit;
  }
  .cbtn:active{transform:scale(.93)}
  .cbtn.main{width:64px;height:64px;font-size:24px;background:linear-gradient(180deg,#d9ba62,#b8933d);color:#221a08;border:none}
  .hint{font-size:12.5px;color:rgba(246,244,239,.5);letter-spacing:.05em;text-align:center;line-height:1.7}

  .toast{
    position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(8px);z-index:50;
    background:rgba(23,20,14,.92);border:1px solid rgba(194,161,77,.7);color:#fdf6dd;
    font-size:13.5px;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity 250ms ease,transform 250ms ease;max-width:86vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="no">Lesson 03 · Anime</span>
    <h1>第 3 课 · 我的家人 <b>— 动漫版样板</b></h1>
  </header>

  <div class="stage" id="stage">
    <img class="bgimg" src="img/bg.webp" alt="白桦林空地，中间放着一本打开的相册">
    <div class="char rabbit" id="charA">
      <div class="char-inner breathe" id="innerA">
        <img class="fr n" src="img/rabbit-neutral.webp" alt="小兔">
        <img class="fr t" id="talkA" src="img/rabbit-talk.webp" alt="" style="opacity:0">
      </div>
    </div>
    <div class="char tiger" id="charB">
      <div class="char-inner breathe" id="innerB">
        <img class="fr n" src="img/tiger-neutral.webp" alt="小虎">
        <img class="fr t" id="talkB" src="img/tiger-talk.webp" alt="" style="opacity:0">
      </div>
    </div>
    <img class="endimg" id="endImg" src="img/scene-happy.webp" alt="小兔和小虎开心地大笑挥手">
    <div class="petals" id="petals" aria-hidden="true"></div>
    <div class="shade"></div>
    <div class="tapzone left" id="tapPrev" aria-label="上一句"></div>
    <div class="tapzone right" id="tapNext" aria-label="下一句"></div>
    <div class="subwrap">
      <div class="badge" id="badge">🐰 小兔</div>
      <div class="subs hidden" id="subs" title="点字幕重播本句">
        <div class="en" id="subEn"></div>
        <div class="cn" id="subCn"></div>
      </div>
    </div>
    <div class="veil" id="coverVeil">
      <div class="big">我的家人</div>
      <div class="sub">小兔和小虎看相册 · 一共 6 句</div>
      <button class="btn" id="btnStart">▶ 开始</button>
    </div>
    <div class="veil gone" id="endVeil">
      <div class="big">🎉 学完啦</div>
      <div class="sub">这一课的对话听完啦，真棒！</div>
      <div class="btnrow">
        <button class="btn" id="btnAgain">↻ 再看一遍</button>
        <a class="btn ghost" href="../">回 App 学习</a>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="dots" id="dots"></div>
    <div class="cbtns">
      <button class="cbtn" id="btnPrev" aria-label="上一句">⏮</button>
      <button class="cbtn main" id="btnPlay" aria-label="播放或暂停">▶</button>
      <button class="cbtn" id="btnNext" aria-label="下一句">⏭</button>
    </div>
    <div class="hint">点舞台左 / 右侧也能翻句 · 点字幕重播本句<br>音频为 App 里的原音，跟着小兔小虎一起读吧</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* 第 3 课 s1d《我和我的家人》dl 全 6 行：角色/英文/中文与 App 数据一字不差（台词同 v1） */
var LINES = [
  {sp:"A", en:"Anna, is this your family photo?", cn:"安娜，这是你的全家福吗？"},
  {sp:"B", en:"Yes. This is my father and this is my mother.", cn:"是的。这是我爸爸，这是我妈妈。"},
  {sp:"A", en:"And this boy? Is he your brother?", cn:"这个男孩呢？他是你弟弟吗？"},
  {sp:"B", en:"Yes, he is. He is ten years old.", cn:"是的。他十岁了。"},
  {sp:"A", en:"What about you? How old are you?", cn:"那你呢？你多大了？"},
  {sp:"B", en:"I'm fifteen. My father is a doctor and my mother is a teacher.", cn:"我十五岁。我爸爸是医生，妈妈是老师。"}
];
var NAMES = {A:"🐰 小兔", B:"🐯 小虎"};
var GAP_MS = 600;        /* 句间气口：一句播完停 600ms 再进下一句 */

var stage = document.getElementById("stage"),
    badge = document.getElementById("badge"),
    subs = document.getElementById("subs"),
    subEn = document.getElementById("subEn"),
    subCn = document.getElementById("subCn"),
    coverVeil = document.getElementById("coverVeil"),
    endVeil = document.getElementById("endVeil"),
    btnPlay = document.getElementById("btnPlay"),
    dotsBox = document.getElementById("dots"),
    toastEl = document.getElementById("toast");

/* ---------- 角色动画引擎：换帧木偶（张嘴/闭嘴两帧交替 + 身体律动） ---------- */
var FLAP_OPEN_MS = 187;   /* 张嘴帧时长（170ms 间隔、占空比约 55% → 周期 340ms） */
var FLAP_SHUT_MS = 153;   /* 闭嘴帧时长 */
var chars = {
  A: { wrap: document.getElementById("charA"), inner: document.getElementById("innerA"), talk: document.getElementById("talkA") },
  B: { wrap: document.getElementById("charB"), inner: document.getElementById("innerB"), talk: document.getElementById("talkB") }
};
function setFrame(sp, open){ chars[sp].talk.style.opacity = open ? "1" : "0"; }
function allNeutral(){ setFrame("A", false); setFrame("B", false); }

var flap = { timer:null, sp:null, open:false, nextAt:0, remain:0, running:false, frozen:false };
function flapStep(){
  flap.open = !flap.open;
  setFrame(flap.sp, flap.open);
  var dur = flap.open ? FLAP_OPEN_MS : FLAP_SHUT_MS;
  flap.nextAt = performance.now() + dur;
  flap.timer = setTimeout(flapStep, dur);
}
function startFlap(sp){
  stopFlap();
  flap.sp = sp; flap.open = true; flap.running = true; flap.frozen = false;
  setFrame(sp, true);
  flap.nextAt = performance.now() + FLAP_OPEN_MS;
  flap.timer = setTimeout(flapStep, FLAP_OPEN_MS);
}
function freezeFlap(){
  if (!flap.running) return;
  clearTimeout(flap.timer); flap.timer = null;
  flap.remain = Math.max(20, flap.nextAt - performance.now());
  flap.running = false; flap.frozen = true;
}
function resumeFlap(){
  if (!flap.frozen || !flap.sp) return;
  flap.frozen = false; flap.running = true;
  flap.nextAt = performance.now() + flap.remain;
  flap.timer = setTimeout(flapStep, flap.remain);
}
function stopFlap(){
  clearTimeout(flap.timer); flap.timer = null;
  flap.sp = null; flap.open = false; flap.running = false; flap.frozen = false;
  allNeutral();
}

/* 角色视觉状态：说话方提亮+轻放大+律动；听者略暗+呼吸；暂停冻结 CSS 动画 */
function curSp(){ return (idx >= 0 && idx < LINES.length) ? LINES[idx].sp : null; }
function paintChars(){
  var sp = curSp();
  ["A","B"].forEach(function(k){
    var c = chars[k], speaking = (state === "playing" && sp === k);
    c.wrap.classList.toggle("is-speaking", speaking);
    c.wrap.classList.toggle("is-listening", (state === "playing" || state === "paused") && sp && sp !== k);
    c.inner.classList.toggle("bounce", speaking);
    c.inner.classList.toggle("breathe", !speaking);
    c.inner.style.animationPlayState = (state === "paused") ? "paused" : "";
  });
}

/* ---------- 环境落叶（JS 生成 8 片，纯 CSS 椭圆片） ---------- */
(function makePetals(){
  var box = document.getElementById("petals");
  var tints = ["rgba(240,206,118,.85)","rgba(196,150,66,.85)","rgba(168,196,110,.8)","rgba(240,178,168,.8)"];
  for (var i = 0; i < 8; i++){
    var p = document.createElement("span");
    p.className = "petal";
    var size = 7 + (i * 5) % 8;                     /* 7–14px */
    p.style.width = size + "px"; p.style.height = (size * 0.72) + "px";
    p.style.left = (4 + (i * 12.3) % 90) + "%";
    p.style.background = "linear-gradient(135deg," + tints[i % 4] + "," + tints[(i + 1) % 4] + ")";
    p.style.animationDuration = (10 + (i * 1.7) % 7) + "s";   /* 10–17s */
    p.style.animationDelay = (-(i * 2.3)) + "s";               /* 错峰，一进来就分布在空中 */
    box.appendChild(p);
  }
})();

/* ---------- 播放流程（沿用 v1 口径：看门狗/失败跳句，节奏改为慢速音源 + 600ms 气口） ---------- */
var idx = -1;            // 当前句序号，未开始为 -1
var state = "cover";     // cover | playing | paused | ended
var seq = 0;             // 播放代次，作废过期回调
var watchdog = null, gapTimer = null;
var pendingNext = -1;    // 句间气口中被暂停时，待播的下一句
var toastTimer = null;

var audio = new Audio();
audio.preload = "auto";
/* 预热全部 6 句，避免逐句加载卡顿 */
var warm = LINES.map(function(_, i){ var a = new Audio(); a.preload = "auto"; a.src = "audio/line" + (i + 1) + ".mp3"; return a; });

var dots = [];
LINES.forEach(function(_, i){
  var d = document.createElement("button");
  d.className = "dot"; d.setAttribute("aria-label", "第 " + (i + 1) + " 句");
  d.addEventListener("click", function(){ if (state !== "cover") playLine(i, true); });
  dotsBox.appendChild(d); dots.push(d);
});

function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
}
function clearTimers(){ clearTimeout(watchdog); clearTimeout(gapTimer); watchdog = gapTimer = null; }

function paintDots(){
  dots.forEach(function(d, i){
    d.classList.toggle("done", idx > i || state === "ended");
    d.classList.toggle("now", idx === i && state !== "ended");
  });
}
function showSubs(i){
  var L = LINES[i];
  subEn.textContent = L.en; subCn.textContent = L.cn;
  badge.textContent = NAMES[L.sp];
  subs.classList.remove("hidden", "pop"); void subs.offsetWidth; subs.classList.add("pop");
  badge.classList.add("show");
}

function playLine(i, manual){
  if (i < 0) i = 0;
  if (i >= LINES.length) return finish();
  clearTimers();
  pendingNext = -1;
  stopFlap();                       /* 切句先让上一方复位闭嘴 */
  idx = i; state = "playing";
  var my = ++seq;
  endVeil.classList.add("gone"); coverVeil.classList.add("gone");
  stage.classList.remove("ended");
  showSubs(i); paintDots(); paintChars();
  btnPlay.textContent = "⏸";
  audio.src = "audio/line" + (i + 1) + ".mp3";
  var p = audio.play();
  startFlap(LINES[i].sp);           /* 嘴型与律动随本句音频启动 */
  paintChars();
  if (p && p.catch) p.catch(function(){ if (my === seq) onAudioFail(my, "这句音频没播出来，已自动跳到下一句"); });
  armWatchdog(my);
}
function armWatchdog(my){
  clearTimeout(watchdog);
  var d = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 8;
  var armedAt = audio.currentTime || 0;
  watchdog = setTimeout(function(){
    if (my !== seq || state !== "playing" || audio.ended) return;
    /* 已正常播过一段且还在播：把看门狗顺延到预计结束之后再查 */
    if (!audio.paused && audio.currentTime > armedAt + 0.3) {
      var left = Math.max(1, (isFinite(audio.duration) && audio.duration > 0 ? audio.duration : d) - audio.currentTime);
      watchdog = setTimeout(function(){
        if (my === seq && state === "playing" && !audio.ended)
          onAudioFail(my, "音频好像卡住了，已自动跳到下一句");
      }, (left + 4) * 1000);
      return;
    }
    onAudioFail(my, "音频好像卡住了，已自动跳到下一句");
  }, (d + 5) * 1000);
}
function onAudioFail(my, msg){
  if (my !== seq) return;
  toast(msg);
  clearTimers();
  stopFlap(); paintChars();
  var nxt = idx + 1;
  gapTimer = setTimeout(function(){ if (my === seq) { nxt >= LINES.length ? finish() : playLine(nxt); } }, GAP_MS);
}
audio.addEventListener("ended", function(){
  if (state !== "playing") return;
  var my = seq; clearTimers();
  stopFlap();                       /* 音频一停，嘴型立刻回闭嘴、律动停 */
  paintChars();
  pendingNext = idx + 1;
  gapTimer = setTimeout(function(){
    if (my !== seq || state !== "playing") return;
    pendingNext = -1;
    idx + 1 >= LINES.length ? finish() : playLine(idx + 1);
  }, GAP_MS);
});
audio.addEventListener("error", function(){
  if (state === "playing") onAudioFail(seq, "这句音频加载失败，已自动跳到下一句");
});
audio.addEventListener("loadedmetadata", function(){ if (state === "playing") armWatchdog(seq); });

function finish(){
  clearTimers(); seq++;
  state = "ended"; idx = LINES.length;
  try { audio.pause(); } catch (e) {}
  stopFlap();
  badge.classList.remove("show");
  subs.classList.add("hidden");
  stage.classList.add("ended");     /* 结尾图全幅替换舞台内容 */
  endVeil.classList.remove("gone");
  btnPlay.textContent = "▶";
  paintDots(); paintChars();
}
function startOver(){
  idx = -1; playLine(0);
}
function togglePlay(){
  if (state === "cover") return startOver();
  if (state === "ended") return startOver();
  if (state === "playing") {
    state = "paused"; seq++; clearTimers();
    freezeFlap();                     /* 换帧定时器随暂停冻结 */
    try { audio.pause(); } catch (e) {}
    btnPlay.textContent = "▶";
  } else if (state === "paused") {
    if (pendingNext >= 0) { var pn = pendingNext; pendingNext = -1; return playLine(pn); }
    state = "playing"; var my = ++seq;
    var p = audio.play();
    resumeFlap();                     /* 恢复后换帧续跑 */
    if (p && p.catch) p.catch(function(){ if (my === seq) onAudioFail(my, "音频没播出来，已自动跳到下一句"); });
    armWatchdog(my);
    btnPlay.textContent = "⏸";
  }
  paintDots(); paintChars();
}
function step(delta){
  if (state === "cover") return;
  if (state === "ended") { if (delta < 0) playLine(LINES.length - 1); return; }
  var t = idx + delta;
  if (t < 0) t = 0;
  if (t >= LINES.length) return finish();
  playLine(t);
}

document.getElementById("btnStart").addEventListener("click", startOver);
document.getElementById("btnAgain").addEventListener("click", startOver);
btnPlay.addEventListener("click", togglePlay);
document.getElementById("btnPrev").addEventListener("click", function(){ step(-1); });
document.getElementById("btnNext").addEventListener("click", function(){ step(1); });
document.getElementById("tapPrev").addEventListener("click", function(){ step(-1); });
document.getElementById("tapNext").addEventListener("click", function(){ step(1); });
subs.addEventListener("click", function(){ if (idx >= 0 && idx < LINES.length) playLine(idx); });

/* 自验探针（无副作用，仅暴露状态） */
window.__anim = { flap: flap, chars: chars, audio: audio, playLine: playLine, togglePlay: togglePlay,
                  getState: function(){ return state; }, getIdx: function(){ return idx; } };
</script>
</body>
